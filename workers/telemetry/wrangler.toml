# CC-TELEMETRY-FOUNDATION v1.1 — telemetry endpoint (D5: Cloudflare Worker).
# Deploy: see README.md. Nothing here is live until Eric runs the deploy.
name = "spell-telemetry"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Mounted on the site's own origin, ahead of the Cloudflare Tunnel: web play
# posts same-origin, and a down Mac mini never costs a crash report.
routes = [{ pattern = "spellgame.net/telemetry/*", zone_name = "spellgame.net" }]

# The kill switch (I7). "false" makes /v1/flags answer off; clients clear their
# queues and stop sending on their next launch. Flip with:
#   npx wrangler deploy --var TELEMETRY_ENABLED:false
[vars]
TELEMETRY_ENABLED = "true"

# Raw events (90 days) + per-day counts (kept). database_id is filled in by
# `wrangler d1 create spell-telemetry` at first deploy.
[[d1_databases]]
binding = "DB"
database_name = "spell-telemetry"
database_id = "REPLACE_AT_FIRST_DEPLOY"
migrations_dir = "migrations"

# D6 — daily purge of raw events older than 90 days.
[triggers]
crons = ["17 4 * * *"]

# No request logs, no Workers Logs, no tail consumers: nothing that could hold
# a client IP (Transport: "must not store client IP addresses").
[observability]
enabled = false
