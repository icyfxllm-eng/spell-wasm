# CC-TELEMETRY-FOUNDATION v1.1 — telemetry endpoint (D5: Cloudflare Worker).
# Deploy: see README.md. Nothing here is live until Eric runs the deploy.
name = "spell-telemetry"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Mounted on the site's own origin, ahead of the Cloudflare Tunnel: web play
# posts same-origin, and a down Mac mini never costs a crash report.
routes = [{ pattern = "spellgame.net/telemetry/*", zone_name = "spellgame.net" }]
# The route above is the ONLY way in: no public *.workers.dev URL and no
# preview URLs, so every request passes the spellgame.net zone.
workers_dev = false
preview_urls = false

# The kill switch (I7). "false" makes /v1/flags answer off; clients clear their
# queues and stop sending on their next launch. Flip with:
#   npx wrangler deploy --var TELEMETRY_ENABLED:false
[vars]
# ON since ~22:54 2026-09-18 (Eric's request, deployed by the privacy.html
# session as version f970d079): the privacy section went live first
# (origin/main 8023f662, spellgame.net/privacy). It was OFF at first deploy.
TELEMETRY_ENABLED = "true"

# Raw events (90 days) + per-day counts (kept). database_id is filled in by
# `wrangler d1 create spell-telemetry` at first deploy (2026-09-18).
[[d1_databases]]
binding = "DB"
database_name = "spell-telemetry"
database_id = "88eeaf34-9310-4696-a542-3d701ff2a7f4"
migrations_dir = "migrations"

# D6 — raw events older than 90 days are purged by the Mac mini's daily
# net.spellgame.telemetry-purge LaunchAgent (scripts/mac-server/), not a cron
# here: Cloudflare refused cron triggers on this account (10063, 2026-09-18).
# The Worker's scheduled() handler stays, so a cron can be re-added later.

# No request logs, no Workers Logs, no tail consumers: nothing that could hold
# a client IP (Transport: "must not store client IP addresses").
[observability]
enabled = false
