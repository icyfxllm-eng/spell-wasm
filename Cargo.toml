[workspace]
members = [".", "tracer-core", "scanlock", "tonal", "server/spell-server", "server/grader-parity", "server/tools/botload"]

[package]
name = "spell_wasm"
version = "0.1.0"
edition = "2021"
# Never published to crates.io (cargo-deny treats unpublished crates as private).
publish = false

[lib]
# rlib in addition to cdylib so integration tests (tests/*.rs) can link the core
# for the editor/mywords property tests; the wasm build still emits the cdylib.
crate-type = ["cdylib", "rlib"]

[features]
# Exposes window.__spelltest (observation-only test seam) for the Playwright
# E2E suite. NEVER enabled in production builds — CI greps the shipped bundle to
# prove its absence (scripts/seam-absence-check.mjs).
testseam = []

# CC-EDITIONS D2 — builds the EDUCATION edition (schools / program buyers)
# instead of the default consumer app. Build-time by design: a runtime edition
# toggle would leave the purchase surface compiled INTO a school's binary and
# merely hide it, which is both a leak risk and an App Review liability.
#
# Selects consts::EDITION = Edition::Education, which turns off every derived
# capability gate (purchases_available, audit_bypass_available,
# leaderboard_available) and adds the education grant to the resolver.
# Ships under a separate bundle ID / distribution artifact.
education = []

# CC-LEARNING-ENGINE-L0 R4 — the dev-only learner inspector (src/inspector.rs):
# the review queue with next-review dates, and why the word on screen was
# served. Build-time only, like `testseam`: with the feature off the module is
# not compiled, it adds no markup or CSS to index.html, and
# scripts/seam-absence-check.mjs greps the shipped bundle for its marker so a
# release, auditor or education build cannot contain it (acceptance 12).
# CC-THEMES-COSMOS T-D10: the Theme Lab. Never in a store build; the Lab
# TestFlight build (internal only, never submitted) turns it on alone.
theme_lab = []
dev_preview = ["theme_lab"]
# AUDIT PREVIEW — a build that un-gates the ComingSoon languages (ar/fa/ur/ru) and
# loads their unverified DRAFT word banks (assets/words-draft/, CC BY-SA, see its
# README) so native speakers can PLAY and review them. Build-time only, and NEVER
# production: like `testseam`, its absence is the guarantee — with the feature off,
# RTL_SUPPORTED stays false, the languages stay gated, and word_data_audit is not
# compiled in. Produces dist-audit/ via scripts/build-web-audit.sh.
audit_preview = []
# CC-LAUNCH-EN Phase B: carry EVERY play language at its authored status. Off,
# the binary carries the release profile: English Active, every other language
# Hidden (consts::RELEASE_LANG_PROFILE). Build-time only, so no flag or remote
# file can un-hide a language. Dev and e2e builds turn it on; store builds never.
all_langs = []
# CC-LAUNCH-EN Phase B item 2: the four network paths the App Store build does
# not carry. Build-time only, like `testseam`: with a feature off its code is
# not compiled, so no flag, stored value or remote file can turn it back on,
# and scripts/seam-absence-check.mjs greps dist/ for a string each one owns.
#   accounts_net  -- Climb accounts (front door, sign-in, account sheet) and
#                    the leaderboard (view + run upload): /api/auth/*, /api/climb/*.
#                    Local Climb play is not behind it.
#   server_check  -- the /api/check round trip; without it English is graded
#                    on the device only (game::en_grade_local).
#   telemetry     -- crash/perf/clip reports and the /v1/flags fetch.
#   server_stt    -- Say-It's server speech rung (/api/stt). The on-device
#                    recognizer is not behind it.
# Dev, e2e and audit builds turn on `net_services`; the App Store, TestFlight
# and education builds never do. `web` carries it so spellgame.net keeps the
# behaviour it has today.
accounts_net = []
server_check = []
telemetry = []
server_stt = []
net_services = ["accounts_net", "server_check", "telemetry", "server_stt"]
# The spellgame.net build. English only (Eric, 2026-07-31): the site is the
# free English experience, the app is where every language lives. Off by
# default so `npm run build` still produces the APP artifact.
web = ["net_services"]
# CC-GAME-SERVER F6: exposes `native_api` (re-exports only) so the room server can
# call the same grader natively, and drops the wasm start export for the parity build.
native = []

[dependencies]
scanlock = { path = "scanlock" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1"
console_error_panic_hook = "0.1"
# CC-IMPOSSIBLE-COMPLETE F4: verify-only Ed25519 for the signed kill-flag file. No rand, no std features.
ed25519-dalek = { version = "2", default-features = false }

[dev-dependencies]
proptest = "1"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Window", "Navigator", "Document", "Element", "HtmlElement", "Node", "NodeList", "DomTokenList",
  "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "HtmlButtonElement",
  "HtmlCanvasElement", "CanvasRenderingContext2d", "HtmlImageElement", "HtmlMediaElement", "HtmlAudioElement", "MediaError",
  "AnimationEvent", "MediaQueryList",
  "Event", "EventTarget", "VisibilityState", "Location", "MouseEvent", "PointerEvent", "KeyboardEvent", "InputEvent",
  "Storage",
  "Request", "RequestInit", "RequestMode", "Response", "Headers",
  "SpeechSynthesis", "SpeechSynthesisUtterance", "SpeechSynthesisVoice", "SpeechSynthesisEvent",
  "DomParser", "SupportedType",
  "CssStyleDeclaration",
  "DomRect", "HtmlCollection",
  "SvgElement", "SvgGraphicsElement", "SvgTextContentElement", "SvgRect",
  "Performance",
  "AudioContext", "AudioContextState", "GainNode", "AudioNode", "AudioParam", "MediaElementAudioSourceNode",
  "DynamicsCompressorNode",
  "AudioDestinationNode", "OscillatorNode", "OscillatorType",
  "OfflineAudioContext", "BaseAudioContext", "AudioBuffer",
  "AddEventListenerOptions", "CanvasGradient",
  # CC-GAME-SERVER Phase C: the online room socket, and ticket audio on the web
  # build (an audio element cannot send the Authorization header, so the clip
  # is fetched and played from a blob URL).
  "WebSocket", "MessageEvent", "CloseEvent", "Blob", "Url",
]

[profile.release]
opt-level = "s"
lto = true
