[package]
name = "spell-server"
version = "0.1.0"
edition = "2021"
publish = false
description = "CC-GAME-SERVER: authoritative room server for online play"

[[bin]]
name = "spell-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
spell_wasm = { path = "../..", features = ["native"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
proptest = "1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "test-util"] }
tokio-tungstenite = "0.30.0"
grader-parity = { path = "../grader-parity" }
md-5 = "0.10"
unicode-normalization = "0.1"

[features]
# Registers the trivial "test"/"test4" modes so integration tests can drive the
# room layer before any real mode exists. Never enabled in the deploy image.
test-modes = []
