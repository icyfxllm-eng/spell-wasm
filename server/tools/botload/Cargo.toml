[package]
name = "botload"
version = "0.1.0"
edition = "2021"
publish = false
description = "CC-GAME-SERVER F16: load, soak and chaos bots for the room server"

[[bin]]
name = "botload"
path = "src/main.rs"

[dependencies]
axum = "0.8"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spell-server = { path = "../../spell-server" }
spell_wasm = { path = "../../..", features = ["native"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
