# CC-GAME-SERVER F14 — cloudflared on Rocky, a NEW tunnel (not spellgame-mac).
#
# Copy to /etc/cloudflared/config.yml and fill the placeholders after
# `cloudflared tunnel create` (HOST-RUNBOOK.md step 11, done by Eric). The
# credentials file is a secret: it is created on the host and never committed.
#
# Only the public listener is routed. The admin listener is reachable over
# the tailnet only and must never appear here (A14.6).

tunnel: <TUNNEL_ID>
credentials-file: <CREDENTIALS_FILE>

ingress:
  - hostname: <HOSTNAME>
    service: http://127.0.0.1:8080
    originRequest:
      # Room sockets idle between turns; keepalive pings every 15 s.
      connectTimeout: 10s
  # Anything else: nothing.
  - service: http_status:404
