# CC-GAME-SERVER F14 / A14.8 — cargo-deny policy for the workspace.
#
#   cargo deny check
#
# Advisories: no crate with a known vulnerability or yanked release. Sources:
# crates.io and the workspace's own path crates only. Licenses: the
# permissive set the dependency tree actually uses. Duplicate versions are
# reported, not fatal: two crate generations side by side is common and
# harmless, and the app's own lockfile is deliberately left untouched.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "BSL-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "0BSD",
]

[[licenses.clarify]]
# ring's license file combines ISC, MIT and OpenSSL-style terms.
crate = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
