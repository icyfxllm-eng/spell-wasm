# CC-WORDLIST-RAFU F3 gates — the trap registry. Runs on every push / PR.
#
# Enforces the data/engine split that makes the registry auditor-editable:
#   * the registry is schema-valid (match kinds, NFC values, alphabet sanity);
#   * every non-auto class justifies itself with `why` + `workflow`
#     (RAFU decision 9: never guess silently);
#   * a `manual` class carries NO live match rule, so it cannot quietly start
#     auto-tagging;
#   * the tagger's match kinds hold against positive AND negative fixtures — a
#     rule that fires on everything is worse than no rule.
#
# NOT gated here: per-tier trap QUOTAS. RAFU decision 6 leaves those to Eric via
# the gap report, and a quota nobody approved is not a gate. When he rules, the
# quota check belongs in this workflow.
name: Wordlists

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR cancels this run: a stale run's
# result is noise, and the queue backs up across a dozen active branches.
# main keeps every run so each commit on it gets its own verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  traps:
    name: Trap registry gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Trap registry schema check
        run: node scripts/trap-tag.mjs --validate

      - name: Tagger self-test (match kinds, positive + negative fixtures)
        run: node scripts/trap-tag.mjs --selftest

      - name: Word-list pipeline gates (charset / exclusions / balance / determinism)
        run: python3 scripts/build-wordlists.py --check
      # Collision tables are word data too, and this is the only check in the
      # repository that could have caught ebd6a673: an English table
      # regenerated at 80 sets where it had been 239 to 264, because the
      # worktree lacked an input. A collision set is accept-all, so the 184
      # missing sets marked learners WRONG for real words the audio cannot
      # tell apart -- and E2E went GREEN on that commit, because a denser grid
      # is not a failing grid.
      #
      # cc5c4470 added this step and had to be reverted the same day: the
      # table has THREE inputs and only cmudict was committed. All three are
      # vendored as of 2026-10-09, and the table is verified to regenerate
      # byte-identically from them, so this can finally run on a runner.
      - name: Collision tables are current
        run: python3 tools/build_collisions.py --check
